name: rigorium

services:
  rigorium:
    build: .
    image: rigorium:latest
    ports:
      - "3001:3001"
    volumes:
      # Persist all Rigorium state: generated config, auth DB, permissions,
      # sessions/projects, memory, skills/plugins, and router stats.
      - rigorium-home:/root/.rigorium
      # Optional: mount an existing config file instead of generating one from env vars.
      # Create the host file first, then uncomment this line.
      # - ${RIGORIUM_CONFIG:-${HOME}/.rigorium/rigorium.yaml}:/root/.rigorium/rigorium.yaml:ro
      # Optional: expose a host workspace to agents running inside the container.
      # - ${RIGORIUM_WORKSPACE:-${PWD}}:/workspace
    environment:
      - NODE_ENV=production
      - RIGORIUM_HOME=/root/.rigorium
      - SERVER_PORT=3001
      - RIGORIUM_GATEWAY_PORT=18789
      # ── Authentication (uncomment to require login) ──
      # - RIGORIUM_DISABLE_LOCAL_AUTH=0
      #
      # ── Proxy (uncomment if behind corporate proxy) ──
      # - https_proxy=http://host.docker.internal:7890
      # - RIGORIUM_PROXY=http://host.docker.internal:7890
      #
      # ── Or configure via env vars instead of mounting yaml ──
      # - RIGORIUM_MODEL=openai/gpt-4.1
      # - RIGORIUM_API_KEY=sk-xxx
      # - RIGORIUM_API_URL=https://api.openai.com/v1
    restart: unless-stopped

volumes:
  rigorium-home:
