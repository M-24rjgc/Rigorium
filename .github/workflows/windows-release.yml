name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RIGORIUM_UPDATE_REPOSITORY: ${{ github.repository }}
      RIGORIUM_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RIGORIUM_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: node scripts/verify-release-tag.mjs "$env:RELEASE_TAG"

      - name: Verify updater and release contracts
        shell: pwsh
        run: |
          pnpm run test:desktop-update
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm --dir ui exec vitest run src/components/updates/DesktopUpdateNotifier.test.tsx

      - name: Build Windows installer
        run: pnpm run desktop:build

      - name: Verify packaged release metadata
        run: pnpm run desktop:verify-release-metadata

      - name: Verify packaged research runtime
        run: pnpm run desktop:verify-research

      - name: Generate release checksums
        id: checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -File -Filter 'Rigorium-Setup-*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $blockmap = Join-Path $installer.DirectoryName "$($installer.Name).blockmap"
          if (-not (Test-Path -LiteralPath $blockmap -PathType Leaf)) { throw "Installer block map was not produced: $blockmap" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii
          $hash | Set-Content -LiteralPath ($installer.FullName + '.sha256') -Encoding ascii
          "installer=release/$($installer.Name)" >> $env:GITHUB_OUTPUT
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "blockmap=release/$([System.IO.Path]::GetFileName($blockmap))" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rigorium-windows-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            ${{ steps.checksum.outputs.installer }}
            ${{ steps.checksum.outputs.installer }}.sha256
            ${{ steps.checksum.outputs.blockmap }}
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            '${{ steps.checksum.outputs.installer }}',
            '${{ steps.checksum.outputs.installer }}.sha256',
            '${{ steps.checksum.outputs.blockmap }}',
            'release/SHA256SUMS.txt'
          )
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $createArgs = @(
              'release', 'create', $env:RELEASE_TAG
            ) + $assets + @(
              '--verify-tag', '--generate-notes',
              '--title', "Rigorium $env:RELEASE_TAG",
              '--repo', $env:GITHUB_REPOSITORY
            )
            if ($env:RELEASE_TAG -match '^v\d+\.\d+\.\d+-') { $createArgs += '--prerelease' }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
