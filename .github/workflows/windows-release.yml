name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish, for example vX.Y.Z
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RIGORIUM_UPDATE_REPOSITORY: ${{ github.repository }}
  RIGORIUM_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RIGORIUM_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Capture release commit
        shell: pwsh
        run: |
          "RIGORIUM_RELEASE_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: node scripts/verify-release-tag.mjs "$env:RELEASE_TAG"

      - name: Verify updater and release contracts
        shell: pwsh
        run: |
          pnpm run test:desktop-runtime
          pnpm run test:desktop-update
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm --dir ui exec vitest run src/components/updates/DesktopUpdateNotifier.test.tsx

      - name: Build Windows installer
        # Unhardened build: the packaged-app verification below launches the
        # binary via playwright, which needs Node CLI inspect support. Fuses
        # are flipped in the dedicated step after verification.
        run: pnpm run desktop:build:unhardened

      - name: Verify packaged release metadata
        run: pnpm run desktop:verify-release-metadata

      - name: Verify packaged research runtime
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            pnpm run desktop:verify-research
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 2) { exit $LASTEXITCODE }
            Write-Warning 'Packaged runtime verification failed once; retrying with a fresh isolated profile.'
          }

      - name: Harden packaged binary (security fuses)
        shell: pwsh
        run: node scripts/flip-electron-fuses.mjs

      - name: Generate Windows installer checksum
        id: checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -File -Filter 'Rigorium-Setup-*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $blockmap = Join-Path $installer.DirectoryName "$($installer.Name).blockmap"
          if (-not (Test-Path -LiteralPath $blockmap -PathType Leaf)) { throw "Installer block map was not produced: $blockmap" }
          $latestYml = Join-Path $installer.DirectoryName 'latest.yml'
          if (-not (Test-Path -LiteralPath $latestYml -PathType Leaf)) { throw "Windows update manifest was not produced: $latestYml" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content -LiteralPath ($installer.FullName + '.sha256') -Encoding ascii
          "installer=release/$($installer.Name)" >> $env:GITHUB_OUTPUT
          "blockmap=release/$([System.IO.Path]::GetFileName($blockmap))" >> $env:GITHUB_OUTPUT
          "latest_yml=release/$([System.IO.Path]::GetFileName($latestYml))" >> $env:GITHUB_OUTPUT

      - name: Assert checksum asset parses with the production updater parser
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { parseInstallerSha256 } from './ui/server/services/desktopUpdateService.js';
            import { readFileSync } from 'node:fs';
            const installer = '${{ steps.checksum.outputs.installer }}';
            const name = installer.split('/').pop();
            const text = readFileSync(installer + '.sha256', 'utf8');
            const parsed = parseInstallerSha256(text, name, { allowBare: true });
            if (!parsed || !/^[a-f0-9]{64}$/.test(parsed)) {
              console.error('Updater cannot parse the produced checksum asset: ' + installer + '.sha256');
              console.error(JSON.stringify(text));
              process.exit(1);
            }
            console.log('checksum parses as ' + parsed);
          "

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rigorium-windows-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            ${{ steps.checksum.outputs.installer }}
            ${{ steps.checksum.outputs.installer }}.sha256
            ${{ steps.checksum.outputs.blockmap }}
            ${{ steps.checksum.outputs.latest_yml }}

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            file_arch: arm64
          - os: macos-15-intel
            arch: x64
            file_arch: x86_64
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Capture release commit
        shell: bash
        run: printf 'RIGORIUM_RELEASE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Verify runner architecture and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(node -p 'process.arch')"
          [[ "$actual_arch" == "${{ matrix.arch }}" ]] || { echo "Expected ${{ matrix.arch }} runner, found $actual_arch." >&2; exit 1; }

          if [[ -n "${CSC_LINK:-}" || -n "${CSC_KEY_PASSWORD:-}" ]]; then
            [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" ]] || { echo 'Both macOS signing secrets are required.' >&2; exit 1; }
          fi
          if [[ -n "${APPLE_ID:-}" || -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -n "${APPLE_TEAM_ID:-}" ]]; then
            [[ -n "${CSC_LINK:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]] || {
              echo 'Notarization requires the signing certificate and all three Apple account secrets.' >&2
              exit 1
            }
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Verify updater and desktop runtime contracts
        run: |
          pnpm run test:desktop-runtime
          pnpm run test:desktop-update
          pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build macOS installer
        run: pnpm run desktop:build:mac:unhardened -- --${{ matrix.arch }}

      - name: Locate and inspect packaged application
        id: package
        shell: bash
        run: |
          set -euo pipefail
          executables=()
          while IFS= read -r executable_path; do executables+=("$executable_path"); done < <(find release -type f -path '*/Rigorium.app/Contents/MacOS/Rigorium' -print)
          [[ ${#executables[@]} -eq 1 ]] || { echo "Expected one packaged executable, found ${#executables[@]}." >&2; exit 1; }
          executable="${executables[0]}"
          app_bundle="${executable%/Contents/MacOS/Rigorium}"
          asar="$app_bundle/Contents/Resources/app.asar"
          [[ -f "$asar" ]] || { echo "Packaged app archive was not produced: $asar" >&2; exit 1; }
          executable_description="$(file "$executable")"
          printf '%s\n' "$executable_description"
          [[ "$executable_description" == *'${{ matrix.file_arch }}'* ]] || {
            echo 'Packaged executable has the wrong architecture.' >&2
            exit 1
          }

          native_count=0
          current_prebuild_count=0
          while IFS= read -r -d '' native_module; do
            if [[ "$native_module" == */prebuilds/* ]]; then
              [[ "$native_module" == */prebuilds/darwin-${{ matrix.arch }}/* ]] || continue
              current_prebuild_count=$((current_prebuild_count + 1))
            fi
            native_count=$((native_count + 1))
            description="$(file "$native_module")"
            printf '%s\n' "$description"
            [[ "$description" == *'${{ matrix.file_arch }}'* || "$description" == *'universal binary'* ]] || {
              echo "Native module has the wrong architecture: $native_module" >&2
              exit 1
            }
          done < <(find "$app_bundle/Contents/Resources/app.asar.unpacked" -type f -name '*.node' -print0)
          [[ $native_count -gt 0 ]] || { echo 'No packaged native modules were found.' >&2; exit 1; }
          [[ $current_prebuild_count -gt 0 ]] || { echo 'No native prebuilds matched the target macOS architecture.' >&2; exit 1; }

          shopt -s nullglob
          dmgs=(release/Rigorium-Setup-*-mac-${{ matrix.arch }}.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "Expected one ${{ matrix.arch }} DMG, found ${#dmgs[@]}." >&2; exit 1; }
          dmg="${dmgs[0]}"
          blockmap="$dmg.blockmap"
          [[ -f "$blockmap" ]] || { echo "DMG block map was not produced: $blockmap" >&2; exit 1; }
          hdiutil verify "$dmg"

          printf 'executable=%s\n' "$executable" >> "$GITHUB_OUTPUT"
          printf 'app_bundle=%s\n' "$app_bundle" >> "$GITHUB_OUTPUT"
          printf 'asar=%s\n' "$asar" >> "$GITHUB_OUTPUT"
          printf 'dmg=%s\n' "$dmg" >> "$GITHUB_OUTPUT"
          printf 'blockmap=%s\n' "$blockmap" >> "$GITHUB_OUTPUT"

      - name: Verify packaged release metadata
        run: node scripts/verify-packaged-release-metadata.mjs '${{ steps.package.outputs.asar }}' '${{ steps.package.outputs.dmg }}'

      - name: Verify packaged research runtime
        timeout-minutes: 10
        run: node scripts/verify-packaged-research.mjs '${{ steps.package.outputs.executable }}'

      - name: Harden packaged binary (security fuses)
        shell: bash
        run: node scripts/flip-electron-fuses.mjs

      - name: Verify application from mounted DMG
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/rigorium-dmg-${{ matrix.arch }}"
          mkdir -p "$mount_point"
          cleanup() { hdiutil detach "$mount_point" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach '${{ steps.package.outputs.dmg }}' -nobrowse -readonly -mountpoint "$mount_point"
          "$mount_point/Rigorium.app/Contents/MacOS/Rigorium" --smoke-test
          hdiutil detach "$mount_point"
          trap - EXIT

      - name: Verify macOS signature and notarization
        if: ${{ env.CSC_LINK != '' }}
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 '${{ steps.package.outputs.app_bundle }}'
          if [[ -n "${APPLE_ID:-}" ]]; then
            xcrun stapler validate '${{ steps.package.outputs.app_bundle }}'
            spctl --assess --type execute --verbose=4 '${{ steps.package.outputs.app_bundle }}'
          fi

      - name: Generate macOS installer checksum
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          dmg='${{ steps.package.outputs.dmg }}'
          hash="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          printf '%s\n' "$hash" > "$dmg.sha256"
          printf 'sha256=%s\n' "$dmg.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rigorium-macos-${{ matrix.arch }}-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.checksum.outputs.sha256 }}
            ${{ steps.package.outputs.blockmap }}

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-windows
      - build-macos

    steps:
      - name: Require signed and notarized macOS release configuration
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -n "$MACOS_CSC_LINK" && -n "$MACOS_CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]] || {
            echo 'Public desktop releases require a Developer ID signature and Apple notarization.' >&2
            echo 'The verified unsigned packages remain available as workflow artifacts for internal testing.' >&2
            exit 1
          }

      - name: Download verified desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rigorium-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set and generate aggregate checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(release-assets/Rigorium-Setup-*.exe)
          mac_arm64=(release-assets/Rigorium-Setup-*-mac-arm64.dmg)
          mac_x64=(release-assets/Rigorium-Setup-*-mac-x64.dmg)
          [[ ${#windows[@]} -eq 1 ]] || { echo "Expected one Windows installer, found ${#windows[@]}." >&2; exit 1; }
          [[ ${#mac_arm64[@]} -eq 1 ]] || { echo "Expected one Apple Silicon installer, found ${#mac_arm64[@]}." >&2; exit 1; }
          [[ ${#mac_x64[@]} -eq 1 ]] || { echo "Expected one Intel Mac installer, found ${#mac_x64[@]}." >&2; exit 1; }
          for installer in "${windows[@]}" "${mac_arm64[@]}" "${mac_x64[@]}"; do
            [[ -f "$installer.sha256" ]] || { echo "Missing checksum for $installer" >&2; exit 1; }
            expected="$(tr -d '[:space:]' < "$installer.sha256")"
            actual="$(sha256sum "$installer" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "Checksum mismatch for $installer" >&2; exit 1; }
          done
          (
            cd release-assets
            sha256sum ./*.exe ./*.dmg | sed 's#  \./#  #' | sort -k2
          ) > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          [[ ${#assets[@]} -gt 0 ]] || { echo 'No release assets were downloaded.' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            create_args=(release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --title "Rigorium $RELEASE_TAG" --repo "$GITHUB_REPOSITORY")
            if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then create_args+=(--prerelease); fi
            gh "${create_args[@]}"
          fi

          remote_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            grep -Fqx "$asset_name" <<< "$remote_assets" || { echo "Published release is missing $asset_name." >&2; exit 1; }
          done

  verify-public-update:
    name: Verify public updater chain (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: publish
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # The env: mapping evaluates before the env context exists, so the tag
      # must be derived from event/ref contexts instead of env.RELEASE_TAG.
      RIGORIUM_PUBLIC_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      RIGORIUM_PUBLIC_CURRENT_VERSION: '0.2.0'
      RIGORIUM_UPDATE_REPOSITORY: ${{ github.repository }}
      RIGORIUM_UPDATE_INCLUDE_PRERELEASE: ${{ contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, '-') && '1' || '0' }}
    steps:
      - name: Check out updater implementation
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public update download against the published release
        run: pnpm run release:verify-public-update
