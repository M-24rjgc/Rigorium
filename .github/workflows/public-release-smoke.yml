name: Public Release Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Latest eligible public release containing Windows and both macOS installers
        required: true
        type: string
      current_version:
        description: Older installed version to simulate
        required: true
        default: 0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-smoke-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-public-update:
    name: Verify ${{ matrix.platform }} ${{ matrix.arch }} update
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RIGORIUM_PUBLIC_RELEASE_TAG: ${{ inputs.tag }}
      RIGORIUM_PUBLIC_CURRENT_VERSION: ${{ inputs.current_version }}
      RIGORIUM_UPDATE_REPOSITORY: ${{ github.repository }}
      RIGORIUM_UPDATE_INCLUDE_PRERELEASE: ${{ contains(inputs.tag, '-') && '1' || '0' }}

    steps:
      - name: Check out updater implementation
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner platform and architecture
        run: node -e "if (process.platform !== '${{ matrix.platform }}' || process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner ' + process.platform + '/' + process.arch)"

      - name: Verify public update download
        run: pnpm run release:verify-public-update
